[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-rag"
version = "0.1.0"
description = "Production-grade RAG with ChromaDB and local sentence-transformer embeddings"
requires-python = ">=3.11"
dependencies = [
    "apex-logging",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    # Phase 2
    "rank-bm25>=0.2.2",
    "ollama>=0.4.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
apex-logging = { path = "../../packages/apex-logging", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
