name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-apex-rag:
    name: apex-rag tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/apex-rag
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install deps
        run: uv venv .venv --python 3.10 && uv pip install -e ".[dev,server]"

      - name: Run tests
        run: .venv/bin/pytest tests/ -v --tb=short

  test-apex-identity:
    name: apex-identity tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/apex-identity
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv venv .venv --python 3.11 && uv pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check src/

      - name: Mypy
        run: .venv/bin/mypy src/

      - name: Tests
        run: .venv/bin/pytest tests/ -v --tb=short

  test-apex-gateway:
    name: apex-gateway tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/apex-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv venv .venv --python 3.11 && uv pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check src/

      - name: Mypy
        run: .venv/bin/mypy src/

      - name: Tests
        run: .venv/bin/pytest tests/ -v --tb=short

  test-apex-agents:
    name: apex-agents tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/apex-agents
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv venv .venv --python 3.11 && uv pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check src/

      - name: Mypy
        run: .venv/bin/mypy src/

      - name: Tests
        run: .venv/bin/pytest tests/ -v --tb=short

  build-apex-portal:
    name: apex-portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/apex-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/apex-portal/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_RAG_URL: http://localhost:8000
          VITE_IDENTITY_URL: http://localhost:8001
          VITE_GATEWAY_URL: http://localhost:8002
          VITE_AGENTS_URL: http://localhost:8003
